apiVersion: logic.kubesmarts.org/v1
kind: LogicFlowDefinition
metadata:
  labels:
    app.kubernetes.io/name: logic-operator
    app.kubernetes.io/managed-by: kustomize
  name: sleepy-workflow-v1-0-0
spec:
  runtimeRef:
    name: hello-runtime
  flow:
    document:
      dsl: '1.0.0'
      namespace: examples
      name: sleepy-workflow
      version: '1.0.0'
    do:
      - greet:
          set:
            greet-message: '${ "Hello, " + .name + "! Sleeping for 30s..." }'
          output:
            as: '${ $input + . }'
      - nap:
          wait:
            seconds: 30
      - wakeUp:
          set:
            wakeup-message: '${ "Done! " + .name + " woke up after sleeping." }'
          output:
            as: '${ $input + . }'
