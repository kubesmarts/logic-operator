apiVersion: logic.kubesmarts.org/v1
kind: LogicPlatform
metadata:
  labels:
    app.kubernetes.io/name: logic-operator
    app.kubernetes.io/managed-by: kustomize
  name: flow-platform
spec:
  dataIndex:
    persistence:
      postgresql:
        secretRef:
          name: postgresql-secret
        serviceRef:
          name: postgresql
          databaseName: logicflow
          databaseSchema: logicflow_dataindex
    vector:
      enabled: true
