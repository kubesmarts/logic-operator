apiVersion: logic.kubesmarts.org/v1
kind: LogicPlatform
metadata:
  labels:
    app.kubernetes.io/name: logic-operator
    app.kubernetes.io/managed-by: kustomize
  name: logicplatform-sample
spec:
  dataIndex:
    enabled: true
    persistence:
      postgresql:
        secretRef:
          name: postgresql-secret
        serviceRef:
          name: postgresql
          databaseName: logicflow
          databaseSchema: logicflow_dataindex
    vector:
      enabled: true
  workflowGateway:
    application:
      image: quay.io/kubesmarts/workflow-gateway:2.0.0-Alpha2
      replicas: 1
    ingress:
      enabled: true
      host: gateway.lvh.me
      ingressClassName: nginx
