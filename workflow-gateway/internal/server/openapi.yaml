openapi: "3.0.3"
info:
  title: Logic Platform Workflow Gateway
  description: >
    HTTP API for discovering workflow definitions, querying Data Index, and proxying
    execution and lifecycle requests to Quarkus Flow Runner. The API listener uses
    container port 8080; management probes use a separate listener on port 8081.
  version: v1

servers:
  - url: /v1
    description: Workflow Gateway API v1

paths:
  /openapi.json:
    get:
      summary: Get this OpenAPI specification
      operationId: getOpenAPISpec
      tags: [Meta]
      responses:
        "200":
          description: OpenAPI 3.0 specification
          content:
            application/json:
              schema:
                type: object

  /openapi:
    get:
      summary: Get this OpenAPI specification
      operationId: getOpenAPISpecAlias
      tags: [Meta]
      responses:
        "200":
          description: OpenAPI 3.0 specification
          content:
            application/json:
              schema:
                type: object

  /definitions/:
    get:
      summary: List discovered workflow identities
      operationId: listDefinitions
      tags: [Definitions]
      responses:
        "200":
          description: Workflow identities from the gateway routing table
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowDefinition"

  /definitions/{namespace}/{name}/{version}:
    get:
      summary: Get a workflow definition document
      description: >
        Fetches the full LogicFlowDefinition from the Kubernetes API. JSON is returned by
        default. Use Accept: application/yaml or application/x-yaml for YAML.
      operationId: getDefinition
      tags: [Definitions]
      parameters:
        - $ref: "#/components/parameters/namespace"
        - $ref: "#/components/parameters/name"
        - $ref: "#/components/parameters/version"
      responses:
        "200":
          description: Workflow document
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/yaml:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /instances/:
    get:
      summary: List workflow instances through Data Index
      operationId: listInstances
      tags: [Instances]
      parameters:
        - name: namespace
          in: query
          schema:
            type: string
        - name: name
          in: query
          schema:
            type: string
        - name: version
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/InstanceStatus"
      responses:
        "200":
          description: Workflow instances returned by Data Index
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        "503":
          description: Data Index is unavailable or has not been discovered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /instances/{id}:
    get:
      summary: Get a workflow instance by ID through Data Index
      operationId: getInstance
      tags: [Instances]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: Workflow instance returned by Data Index
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Data Index is unavailable or has not been discovered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /runtime/{namespace}/{name}:
    post:
      summary: Start an asynchronous workflow execution (latest version)
      operationId: executeWorkflow
      tags: [Runtime]
      parameters:
        - $ref: "#/components/parameters/namespace"
        - $ref: "#/components/parameters/name"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteRequest"
      responses:
        "202":
          description: Execution accepted by the runtime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecuteResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /runtime/{namespace}/{name}/{version}:
    post:
      summary: Start an asynchronous workflow execution (specific version)
      operationId: executeWorkflowVersioned
      tags: [Runtime]
      parameters:
        - $ref: "#/components/parameters/namespace"
        - $ref: "#/components/parameters/name"
        - $ref: "#/components/parameters/version"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteRequest"
      responses:
        "202":
          description: Execution accepted by the runtime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecuteResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /runtime/{namespace}/{name}/sync:
    post:
      summary: Execute a workflow synchronously (latest version)
      operationId: executeWorkflowSync
      tags: [Runtime]
      parameters:
        - $ref: "#/components/parameters/namespace"
        - $ref: "#/components/parameters/name"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteRequest"
      responses:
        "200":
          description: Synchronous response from the runtime
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /runtime/{namespace}/{name}/{version}/sync:
    post:
      summary: Execute a workflow synchronously (specific version)
      operationId: executeWorkflowSyncVersioned
      tags: [Runtime]
      parameters:
        - $ref: "#/components/parameters/namespace"
        - $ref: "#/components/parameters/name"
        - $ref: "#/components/parameters/version"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteRequest"
      responses:
        "200":
          description: Synchronous response from the runtime
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /runtime/{namespace}/{name}/instance/{id}/suspend:
    post:
      summary: Suspend a workflow instance
      operationId: suspendInstance
      tags: [Runtime]
      parameters:
        - $ref: "#/components/parameters/namespace"
        - $ref: "#/components/parameters/name"
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: Response from the runtime
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /runtime/{namespace}/{name}/instance/{id}/resume:
    post:
      summary: Resume a workflow instance
      operationId: resumeInstance
      tags: [Runtime]
      parameters:
        - $ref: "#/components/parameters/namespace"
        - $ref: "#/components/parameters/name"
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: Response from the runtime
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /runtime/{namespace}/{name}/instance/{id}/cancel:
    post:
      summary: Cancel a workflow instance
      operationId: cancelInstance
      tags: [Runtime]
      parameters:
        - $ref: "#/components/parameters/namespace"
        - $ref: "#/components/parameters/name"
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: Response from the runtime
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /runtime/{namespace}/{name}/{version}/instance/{id}/suspend:
    post:
      summary: Suspend a workflow instance (versioned path)
      operationId: suspendInstanceVersioned
      tags: [Runtime]
      parameters:
        - $ref: "#/components/parameters/namespace"
        - $ref: "#/components/parameters/name"
        - $ref: "#/components/parameters/version"
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: Response from the runtime
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /runtime/{namespace}/{name}/{version}/instance/{id}/resume:
    post:
      summary: Resume a workflow instance (versioned path)
      operationId: resumeInstanceVersioned
      tags: [Runtime]
      parameters:
        - $ref: "#/components/parameters/namespace"
        - $ref: "#/components/parameters/name"
        - $ref: "#/components/parameters/version"
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: Response from the runtime
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /runtime/{namespace}/{name}/{version}/instance/{id}/cancel:
    post:
      summary: Cancel a workflow instance (versioned path)
      operationId: cancelInstanceVersioned
      tags: [Runtime]
      parameters:
        - $ref: "#/components/parameters/namespace"
        - $ref: "#/components/parameters/name"
        - $ref: "#/components/parameters/version"
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: Response from the runtime
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

components:
  parameters:
    namespace:
      name: namespace
      in: path
      required: true
      schema:
        type: string
    name:
      name: name
      in: path
      required: true
      schema:
        type: string
    version:
      name: version
      in: path
      required: true
      schema:
        type: string
    instanceId:
      name: id
      in: path
      required: true
      description: Workflow instance ID
      schema:
        type: string

  schemas:
    WorkflowDefinition:
      type: object
      required: [namespace, name, version]
      properties:
        namespace:
          type: string
        name:
          type: string
        version:
          type: string

    InstanceStatus:
      type: string
      description: Data Index workflow instance status filter

    ExecuteRequest:
      type: object
      additionalProperties: true

    ExecuteResponse:
      type: object
      additionalProperties: true
      description: Response returned by the Quarkus Flow Runner for an accepted execution

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

  responses:
    NotFound:
      description: Workflow or instance not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpstreamError:
      description: Upstream service error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
