version: "2"

run:
  allow-parallel-runners: true

linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: comment-spacings
        - name: import-shadowing
        - name: indent-error-flow
        - name: var-naming
        - name: var-declaration
        - name: context-as-argument
        - name: unused-parameter
        - name: dot-imports
  exclusions:
    rules:
      # ginkgo/gomega dot-imports are idiomatic in test files
      - path: (_test\.go|test/)
        linters:
          - revive
        text: "dot-imports"
      # duplications are expected in controller reconcile loops
      - path: "internal/"
        linters:
          - dupl
    paths:
      - third_party
      - builtin
      - examples

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
