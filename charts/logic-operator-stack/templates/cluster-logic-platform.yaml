{{- if and .Values.clusterLogicPlatform.gateway.ingress.enabled (not .Values.clusterLogicPlatform.gateway.ingress.host) }}
{{- fail "clusterLogicPlatform.gateway.ingress.host is required when ingress is enabled" }}
{{- end }}
apiVersion: logic.kubesmarts.org/v1
kind: ClusterLogicPlatform
metadata:
  name: {{ .Values.clusterLogicPlatform.name | default (include "logic-operator-stack.fullname" .) | trunc 63 | trimSuffix "-" }}
spec:
  targetNamespace: {{ .Values.clusterLogicPlatform.targetNamespace | quote }}
{{- if .Values.clusterLogicPlatform.dataIndex.enabled }}
  dataIndex:
    persistence:
      postgresql:
        secretRef:
          name: {{ .Values.postgresql.auth.existingSecret | default (printf "%s-postgresql" (include "logic-operator-stack.fullname" .)) }}
        serviceRef:
          name: {{ include "logic-operator-stack.fullname" . }}-postgresql
          namespace: {{ .Values.clusterLogicPlatform.targetNamespace | quote }}
          databaseName: {{ .Values.postgresql.auth.database | quote }}
          databaseSchema: data_index
{{- end }}
{{- if .Values.clusterLogicPlatform.vector.enabled }}
  vector: {}
{{- end }}
  gateway:
    application:
      replicas: {{ .Values.clusterLogicPlatform.gateway.replicas }}
      {{- with .Values.clusterLogicPlatform.gateway.image }}
      image: {{ . | quote }}
      {{- end }}
    ingress:
      enabled: {{ .Values.clusterLogicPlatform.gateway.ingress.enabled }}
      {{- with .Values.clusterLogicPlatform.gateway.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      {{- with .Values.clusterLogicPlatform.gateway.ingress.ingressClassName }}
      ingressClassName: {{ . | quote }}
      {{- end }}
  runtime:
    persistence:
      runtime:
        postgresql:
          secretRef:
            name: {{ .Values.postgresql.auth.existingSecret | default (printf "%s-postgresql" (include "logic-operator-stack.fullname" .)) }}
          serviceRef:
            name: {{ include "logic-operator-stack.fullname" . }}-postgresql
            namespace: {{ .Values.clusterLogicPlatform.targetNamespace | quote }}
            databaseName: {{ .Values.postgresql.auth.database | quote }}
            databaseSchema: runtime
      quartz:
        postgresql:
          secretRef:
            name: {{ .Values.postgresql.auth.existingSecret | default (printf "%s-postgresql" (include "logic-operator-stack.fullname" .)) }}
          serviceRef:
            name: {{ include "logic-operator-stack.fullname" . }}-postgresql
            namespace: {{ .Values.clusterLogicPlatform.targetNamespace | quote }}
            databaseName: {{ .Values.postgresql.auth.database | quote }}
            databaseSchema: quartz
