{{- if and .Values.logicPlatform.workflowGateway.ingress.enabled (not .Values.logicPlatform.workflowGateway.ingress.host) }}
{{- fail "logicPlatform.workflowGateway.ingress.host is required when ingress is enabled" }}
{{ end }}
apiVersion: logic.kubesmarts.org/v1
kind: LogicPlatform
metadata:
  name: {{ .Values.logicPlatform.name | default (include "logic-operator-stack.fullname" .) | trunc 63 | trimSuffix "-" }}
spec:
  dataIndex:
    enabled: {{ .Values.logicPlatform.dataIndex.enabled }}
    persistence:
      postgresql:
        secretRef:
          name: {{ .Values.postgresql.auth.existingSecret | default (printf "%s-postgresql" (include "logic-operator-stack.fullname" .)) }}
        serviceRef:
          name: {{ include "logic-operator-stack.fullname" . }}-postgresql
          databaseName: {{ .Values.postgresql.auth.database | quote }}
          databaseSchema: logicflow_dataindex
    vector:
      enabled: {{ .Values.logicPlatform.dataIndex.vector.enabled }}
  workflowGateway:
    application:
      replicas: {{ .Values.logicPlatform.workflowGateway.replicas }}
      {{ with .Values.logicPlatform.workflowGateway.image }}
      image: {{ . | quote }}
      {{ end }}
    ingress:
      enabled: {{ .Values.logicPlatform.workflowGateway.ingress.enabled }}
      {{ with .Values.logicPlatform.workflowGateway.ingress.host }}
      host: {{ . | quote }}
      {{ end }}
      {{ with .Values.logicPlatform.workflowGateway.ingress.className }}
      ingressClassName: {{ . | quote }}
      {{ end }}
