logic-operator:
  image:
    repository: quay.io/kubesmarts/logic-operator
    tag: ""
    pullPolicy: IfNotPresent

clusterLogicPlatform:
  name: ""
  targetNamespace: logic-platform
  createNamespace: true
  dataIndex:
    enabled: true
  vector:
    enabled: true
  gateway:
    replicas: 1
    # Leave empty to use the gateway image version embedded in the operator.
    image: ""
    ingress:
      enabled: false
      host: ""
      ingressClassName: ""

postgresql:
  image: postgres:16-alpine
  auth:
    username: logicflow
    password: logicflow
    database: logicflow
    existingSecret: ""
  persistence:
    enabled: true
    storageClassName: ""
    size: 8Gi
