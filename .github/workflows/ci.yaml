name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'adr/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'adr/**'
      - 'LICENSE'
      - '.gitignore'

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Check go fmt
        run: |
          OUTPUT=$(go fmt ./...)
          if [ -n "$OUTPUT" ]; then
            echo "The following files are not formatted:"
            echo "$OUTPUT"
            echo "Please run 'go fmt ./...' locally and commit the changes"
            exit 1
          fi

      - name: Check generated code is up to date
        run: |
          make manifests generate
          if ! git diff --quiet; then
            echo "Generated files are out of date. Please run 'make manifests generate' and commit the changes."
            git diff --stat
            exit 1
          fi

      - name: Run linter
        run: make lint

      - name: Run build
        run: make build

      - name: Run unit tests
        run: make test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: cover.out
          retention-days: 14

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up E2E test infrastructure
        run: make setup-test-e2e

      - name: Run e2e tests
        run: make test-e2e

      - name: Collect failure logs
        if: failure()
        run: |
          echo "=== Pod status ==="
          kubectl get pods -A
          echo "=== Events ==="
          kubectl get events -n logic-operator-system --sort-by=.lastTimestamp || true
          echo "=== Controller logs ==="
          kubectl logs -l control-plane=controller-manager -n logic-operator-system --tail=100 || true
          echo "=== Cert-manager logs ==="
          kubectl logs -l app=cert-manager -n cert-manager --tail=50 || true
