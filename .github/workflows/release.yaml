name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest
    outputs:
      operator_version: ${{ steps.versions.outputs.operator_version }}
      gateway_version: ${{ steps.versions.outputs.gateway_version }}
      git_commit: ${{ steps.versions.outputs.git_commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Read versions from versions.mk
        id: versions
        run: |
          make -s print-versions >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Validate operator version
        id: validate
        env:
          OPERATOR_VERSION: ${{ steps.versions.outputs.operator_version }}
        run: |
          if [ -z "${OPERATOR_VERSION}" ]; then
            echo "❌ ERROR: OPERATOR_VERSION is empty"
            exit 1
          fi

          if [[ ! "${OPERATOR_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "❌ ERROR: OPERATOR_VERSION must be a valid Helm SemVer version (for example, 2.0.0-Alpha3)"
            exit 1
          fi

          if [[ "${OPERATOR_VERSION}" == *"-SNAPSHOT"* ]]; then
            echo "❌ ERROR: Cannot release SNAPSHOT version ${OPERATOR_VERSION}"
            exit 1
          fi

          echo "✅ Version validation passed: ${OPERATOR_VERSION}"

      - name: Sync Vector configs from logic-apps
        run: make sync-configs

      - name: Check go fmt
        run: |
          OUTPUT=$(go fmt ./...)
          if [ -n "$OUTPUT" ]; then
            echo "The following files are not formatted:"
            echo "$OUTPUT"
            exit 1
          fi

      - name: Check generated code is up to date
        run: |
          make manifests generate
          if ! git diff --quiet; then
            echo "Generated files are out of date."
            git diff --stat
            exit 1
          fi

      - name: Run linter
        run: make lint

      - name: Run build
        run: make build

      - name: Check generated files after build
        run: |
          if ! git diff --quiet; then
            echo "Generated files were modified by the build."
            git diff --stat
            exit 1
          fi

      - name: Run unit tests
        run: make test

  gateway-integration:
    name: Gateway ↔ Runner Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Sync Vector configs from logic-apps
        run: make sync-configs

      - name: Run gateway integration tests
        run: make test-gateway-integration

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Sync Vector configs from logic-apps
        run: make sync-configs

      - name: Set up E2E test infrastructure
        run: make setup-test-e2e

      - name: Run e2e tests
        run: make test-e2e

      - name: Collect failure logs
        if: failure()
        run: |
          echo "=== Pod status ==="
          kubectl get pods -A
          echo "=== Events ==="
          kubectl get events -n logic-operator-system --sort-by=.lastTimestamp || true
          echo "=== Controller logs ==="
          kubectl logs -l control-plane=controller-manager -n logic-operator-system --tail=100 || true

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [validate, gateway-integration, e2e]
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Package Helm charts and CRDs
        env:
          OPERATOR_VERSION: ${{ needs.validate.outputs.operator_version }}
        run: make helm-package "OPERATOR_VERSION=${OPERATOR_VERSION}"

      - name: Check release tag
        id: check-tag
        env:
          OPERATOR_VERSION: ${{ needs.validate.outputs.operator_version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          git fetch origin --tags
          TAG="v${OPERATOR_VERSION}"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            EXISTING_COMMIT=$(git rev-list -n 1 "${TAG}")
            if [ "${EXISTING_COMMIT}" != "${RELEASE_COMMIT}" ]; then
              echo "❌ ERROR: Tag ${TAG} already exists at a different commit"
              exit 1
            fi
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create and push annotated tag
        if: steps.check-tag.outputs.tag_exists != 'true'
        env:
          TAG: ${{ steps.check-tag.outputs.tag }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "noreply@github.com"
          git tag -a "${TAG}" -m "Release ${TAG}" "${{ github.sha }}"
          git push origin "${TAG}"

      - name: Create GitHub Release if needed
        env:
          TAG: ${{ steps.check-tag.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --title "Release ${TAG}" \
              --generate-notes
          fi

      - name: Attach charts and CRDs to GitHub Release
        env:
          TAG: ${{ steps.check-tag.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${TAG}" dist/helm/*.tgz dist/helm/crds.yaml --clobber

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GH_TOKEN}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publish Helm charts to GHCR
        env:
          OPERATOR_VERSION: ${{ needs.validate.outputs.operator_version }}
        run: |
          helm push "dist/helm/logic-operator-${OPERATOR_VERSION}.tgz" oci://ghcr.io/kubesmarts/charts
          helm push "dist/helm/logic-operator-stack-${OPERATOR_VERSION}.tgz" oci://ghcr.io/kubesmarts/charts

      - name: Summary
        env:
          TAG: ${{ steps.check-tag.outputs.tag }}
          OPERATOR_VERSION: ${{ needs.validate.outputs.operator_version }}
          GATEWAY_VERSION: ${{ needs.validate.outputs.gateway_version }}
        run: |
          echo "### ✅ Release Created Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release Tag:** \`${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Component Versions:**" >> $GITHUB_STEP_SUMMARY
          echo "- Operator: \`${OPERATOR_VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow Gateway: \`${GATEWAY_VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Helm charts:** Published to GHCR and attached with `crds.yaml` to the GitHub Release." >> $GITHUB_STEP_SUMMARY
          echo "**Next Step:** Run the [Publish Images](../../actions/workflows/publish-images.yaml) workflow with \`source_tag: ${TAG}\` before installing the chart." >> $GITHUB_STEP_SUMMARY
